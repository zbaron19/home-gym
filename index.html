// map an exercise name to a pose pattern (order matters)
const PATTERN_RULES = [
  [/pull up|chin|hanging/, "pullup"],
  [/side plank|copenhagen/, "sideplank"],
  [/bench press|skullcrusher|chest fly/, "benchpress"],
  [/reverse fly|lateral raise|delt/, "lateralraise"],
  [/push up|pushup|up-down|pike/, "pushup"],
  [/dip/, "dip"],
  [/curl/, "curl"],
  [/row/, "row"],
  [/overhead press|shoulder|press\)/, "overheadpress"],
  [/deadlift|good morning|swing/, "hinge"],
  [/bridge|hip thrust/, "bridge"],
  [/calf raise/, "calfraise"],
  [/split squat|lunge|step-up|split jumps|pyro/, "lunge"],
  [/mountain climber|plank jack|shoot/, "climber"],
  [/plank/, "plank"],
  [/ab wheel|rollout|inchworm/, "abwheel"],
  [/russian/, "twist"],
  [/v-sit|v-hold|v-ups/, "vsit"],
  [/crunch|sit up/, "crunch"],
  [/dead bug|scissor|flutter|heel tap|leg swipe|swipes|leg raise|bicycle|hand-toe|cross-body/, "supine"],
  [/superman/, "superman"],
  [/jack|star jump/, "jumpingjack"],
  [/burpee/, "burpee"],
  [/jump|frog/, "jump"],
  [/high knee|butt kick|sprint|fast feet|toe tap/, "run"],
  [/skater|shuffle|karaoke/, "skater"],
  [/bear crawl|crab/, "crawl"],
  [/wall sit|squat/, "squat"],
];
function patternFor(name) {
  const n = name.toLowerCase();
  for (const [re, p] of PATTERN_RULES) if (re.test(n)) return p;
  return "squat";
}

function Frame({ f, color, opacity = 1 }) {
  return (
    <g opacity={opacity}>
      <circle cx={f.head[0]} cy={f.head[1]} r="6.5" fill="none" stroke={color} strokeWidth="3.5" />
      {(f.lines || []).map((l, i) => (
        <line key={i} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} stroke={color} strokeWidth="3.5" strokeLinecap="round" />
      ))}
      {(f.props || []).map((l, i) => (
        <line key={"p" + i} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} stroke="#4A515B" strokeWidth="3" strokeLinecap="round" />
      ))}
      {(f.circles || []).map((c, i) => (
        <circle key={"c" + i} cx={c[0]} cy={c[1]} r={c[2]} fill="none" stroke="#4A515B" strokeWidth="3" />
      ))}
      {(f.dots || []).map((d, i) => (
        <circle key={"d" + i} cx={d[0]} cy={d[1]} r="3.5" fill="#FFD338" />
      ))}
    </g>
  );
}

// oscillates 0→1→0 with ease-in-out, ~30fps
function useOscillator(period = 1700) {
  const [t, setT] = useState(0);
  useEffect(() => {
    let raf,
      last = 0;
    const start = performance.now();
    const loop = (now) => {
      if (now - last > 33) {
        last = now;
        const p = ((now - start) % period) / period;
        setT((1 - Math.cos(2 * Math.PI * p)) / 2);
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [period]);
  return t;
}

const lerp = (a, b, t) => a + (b - a) * t;
const lerpArr = (A = [], B = [], t) => A.map((v, i) => lerp(v, B[i] ?? v, t));

function tweenFrame(A, B, t) {
  return {
    head: lerpArr(A.head, B.head, t),
    lines: (A.lines || []).map((l, i) => lerpArr(l, (B.lines || [])[i] || l, t)),
    props: A.props,
    circles: (A.circles || []).map((c, i) => lerpArr(c, (B.circles || [])[i] || c, t)),
    dots: (A.dots || []).map((d, i) => lerpArr(d, (B.dots || [])[i] || d, t)),
  };
}

function Demo({ name, size = 130, color = "#F2F0EA" }) {
  const t = useOscillator();
  const frames = POSES[patternFor(name)];
  if (!frames) return null;
  const [A, B] = frames;
  const smooth = (A.lines || []).length === (B.lines || []).length;
  return (
    <svg viewBox="0 0 120 100" width={size} height={size * 0.83} style={{ display: "block" }}>
      <line x1="10" y1="92" x2="110" y2="92" stroke="#2A2F37" strokeWidth="2" strokeLinecap="round" />
      {smooth ? (
        <Frame f={tweenFrame(A, B, t)} color={color} />
      ) : (
        <>
          <Frame f={A} color={color} opacity={1 - t} />
          <Frame f={B} color={color} opacity={t} />
        </>
      )}
    </svg>
  );
}

// Build a ~30 min workout
function generateWorkout(focus, mode) {
  const pool = (f) => EXERCISES.filter((e) => e.focus === f);
  let picks = [];

  if (mode === "strength") {
    // 6 exercises × 3 sets, 40s work + 60s rest ≈ 30 min
    if (focus === "auto") {
      picks = [
        ...shuffle(pool("upper").filter((e) => e.str)).slice(0, 2),
        ...shuffle(pool("lower").filter((e) => e.str)).slice(0, 2),
        ...shuffle(pool("core")).slice(0, 2),
      ];
    } else if (focus === "core") {
      picks = shuffle(pool("core")).slice(0, 6);
    } else if (focus === "cardio") {
      // cardio-strength hybrid
      picks = [...shuffle(pool("cardio")).slice(0, 4), ...shuffle(pool("core")).slice(0, 2)];
    } else {
      picks = shuffle(pool(focus).filter((e) => e.str)).slice(0, 5);
      picks.push(shuffle(pool("core"))[0]); // finisher
    }
    return { mode, focus, exercises: picks, sets: 3, workSec: 40, restSec: 60 };
  }

  // HIIT: 10 exercises × 3 rounds, 45/15 = 30 min
  if (focus === "auto") {
    picks = [
      ...shuffle(pool("cardio")).slice(0, 4),
      ...shuffle(pool("upper")).slice(0, 2),
      ...shuffle(pool("lower")).slice(0, 2),
      ...shuffle(pool("core")).slice(0, 2),
    ];
  } else if (focus === "cardio") {
    picks = [...shuffle(pool("cardio")).slice(0, 7), ...shuffle(pool("core")).slice(0, 3)];
  } else {
    picks = [...shuffle(pool(focus)).slice(0, 7), ...shuffle(pool("cardio")).slice(0, 3)];
  }
  picks = shuffle(picks);
  return { mode, focus, exercises: picks, rounds: 3, workSec: 45, restSec: 15 };
}

// ---------- storage ----------
const store = {
  async get(key) {
    try {
      const v = localStorage.getItem("homegym:" + key);
      return v ? JSON.parse(v) : null;
    } catch {
      return null;
    }
  },
  async set(key, val) {
    try {
      localStorage.setItem("homegym:" + key, JSON.stringify(val));
    } catch (e) {
      console.error("storage", e);
    }
  },
};

// ---------- audio beeps ----------
let audioCtx = null;
function beep(freq = 880, dur = 0.12, when = 0) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = "square";
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(audioCtx.destination);
    const t = audioCtx.currentTime + when;
    o.start(t);
    o.stop(t + dur);
  } catch {}
}

function App() {
  const [screen, setScreen] = useState("profile"); // profile | home | workout | done | history
  const [profiles, setProfiles] = useState([]);
  const [profile, setProfile] = useState(null);
  const [newName, setNewName] = useState("");
  const [focus, setFocus] = useState("auto");
  const [mode, setMode] = useState("strength");
  const [workout, setWorkout] = useState(null);
  const [history, setHistory] = useState([]);
  const [tv, setTv] = useState(false);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const p = (await store.get("profiles")) || [];
      const h = (await store.get("history")) || [];
      setProfiles(p);
      setHistory(h);
      setLoaded(true);
    })();
  }, []);

  const addProfile = async () => {
    const name = newName.trim();
    if (!name) return;
    const p = [...profiles.filter((x) => x !== name), name];
    setProfiles(p);
    await store.set("profiles", p);
    setNewName("");
    setProfile(name);
    setScreen("home");
  };

  const startWorkout = (regen) => {
    const w = regen || generateWorkout(focus, mode);
    // seed weights from last logged session for this profile
    const lastWeights = {};
    history
      .filter((h) => h.profile === profile)
      .forEach((h) =>
        (h.entries || []).forEach((en) => {
          if (en.weight) lastWeights[en.name] = en.weight;
        })
      );
    w.exercises = w.exercises.map((e) => ({
      ...e,
      weight: lastWeights[e.n] ?? e.seed ?? null,
    }));
    setWorkout(w);
    setScreen("workout");
  };

  const saveSession = async (session) => {
    const rec = { ...session, profile, date: new Date().toISOString() };
    const h = [rec, ...history].slice(0, 200);
    setHistory(h);
    await store.set("history", h);
  };

  if (!loaded)
    return (
      <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "#8A9199", fontFamily: F.utility, letterSpacing: 2 }}>LOADING…</div>
      </div>
    );

  return (
    <div style={S.app}>
      <style>{CSS}</style>
      {screen === "profile" && (
        <ProfileScreen {...{ profiles, setProfile, setScreen, newName, setNewName, addProfile }} />
      )}
      {screen === "home" && (
        <HomeScreen
          {...{ profile, focus, setFocus, mode, setMode, startWorkout, setScreen, history }}
          switchProfile={() => setScreen("profile")}
        />
      )}
      {screen === "workout" && workout && (
        <WorkoutScreen
          workout={workout}
          tv={tv}
          setTv={setTv}
          onQuit={() => setScreen("home")}
          onFinish={async (session) => {
            await saveSession(session);
            setScreen("done");
          }}
        />
      )}
      {screen === "done" && <DoneScreen onHome={() => setScreen("home")} onHistory={() => setScreen("history")} />}
      {screen === "history" && (
        <HistoryScreen history={history} profile={profile} onBack={() => setScreen("home")} />
      )}
    </div>
  );
}

// ---------- the workout player ----------
function WorkoutScreen({ workout, onQuit, onFinish, tv, setTv }) {
  const isStrength = workout.mode === "strength";
  // Build the full timeline of steps
  const steps = useRef([]);
  if (steps.current.length === 0) {
    const arr = [];
    if (isStrength) {
      workout.exercises.forEach((ex, ei) => {
        for (let s = 1; s <= workout.sets; s++) {
          arr.push({ type: "work", ex, ei, set: s, dur: workout.workSec, label: `SET ${s} OF ${workout.sets}` });
          const last = ei === workout.exercises.length - 1 && s === workout.sets;
          if (!last) arr.push({ type: "rest", ex, ei, set: s, dur: workout.restSec, next: s < workout.sets ? ex : workout.exercises[ei + 1] });
        }
      });
    } else {
      for (let r = 1; r <= workout.rounds; r++) {
        workout.exercises.forEach((ex, ei) => {
          arr.push({ type: "work", ex, ei, round: r, dur: workout.workSec, label: `ROUND ${r} OF ${workout.rounds}` });
          const last = r === workout.rounds && ei === workout.exercises.length - 1;
          if (!last)
            arr.push({
              type: "rest",
              ex,
              ei,
              round: r,
              dur: workout.restSec,
              next: ei < workout.exercises.length - 1 ? workout.exercises[ei + 1] : workout.exercises[0],
            });
        });
      }
    }
    steps.current = arr;
  }

  const [idx, setIdx] = useState(0);
  const [remaining, setRemaining] = useState(steps.current[0].dur);
  const [paused, setPaused] = useState(true);
  const [started, setStarted] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [weights, setWeights] = useState(() => Object.fromEntries(workout.exercises.map((e) => [e.n, e.weight ?? ""])));
  const startTime = useRef(null);

  const step = steps.current[idx];
  const totalSteps = steps.current.length;

  const advance = useCallback(() => {
    if (idx + 1 >= totalSteps) {
      finish();
      return;
    }
    const next = steps.current[idx + 1];
    setIdx(idx + 1);
    setRemaining(next.dur);
    beep(next.type === "work" ? 1200 : 500, 0.18);
  }, [idx, totalSteps]);

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => {
      setElapsed((e) => e + 1);
      setRemaining((r) => {
        if (r <= 1) {
          setTimeout(advance, 0);
          return 0;
        }
        if (r <= 4) beep(880, 0.08);
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [paused, advance]);

  const finish = () => {
    const entries = workout.exercises.map((e) => ({
      name: e.n,
      weight: weights[e.n] === "" ? null : Number(weights[e.n]),
    }));
    onFinish({
      mode: workout.mode,
      focus: workout.focus,
      durationSec: elapsed,
      entries,
      exerciseCount: workout.exercises.length,
    });
  };

  const isWork = step.type === "work";
  const progress = 1 - remaining / step.dur;
  const R = tv ? 150 : 110;
  const C = 2 * Math.PI * R;

  return (
    <div style={{ ...S.workoutWrap, padding: tv ? "40px 5vw" : "20px 18px" }}>
      {/* top bar */}
      <div style={S.topBar}>
        <button className="chip" onClick={onQuit}>← quit</button>
        <div style={{ fontFamily: F.utility, letterSpacing: 3, fontSize: 12, color: "#8A9199" }}>
          {fmt(elapsed)} ELAPSED · {idx + 1}/{totalSteps}
        </div>
        <button className="chip" onClick={() => setTv(!tv)}>{tv ? "phone view" : "tv view"}</button>
      </div>

      {/* status */}
      <div style={{ textAlign: "center", marginTop: tv ? 20 : 10 }}>
        <div
          style={{
            fontFamily: F.utility,
            letterSpacing: 6,
            fontSize: tv ? 22 : 13,
            color: isWork ? "#FFD338" : "#5FA8FF",
          }}
        >
          {isWork ? "WORK" : "REST"}
        </div>
        <div style={{ display: "flex", justifyContent: "center", marginTop: 6 }}>
          {isWork ? (
            <Demo name={step.ex.n} size={tv ? 220 : 130} />
          ) : step.next ? (
            <Demo name={step.next.n} size={tv ? 220 : 130} color="#5FA8FF" />
          ) : null}
        </div>
        <h1
          style={{
            fontFamily: F.display,
            fontSize: tv ? "min(7vw, 76px)" : 34,
            margin: "8px 0 2px",
            lineHeight: 1.05,
            textTransform: "uppercase",
            letterSpacing: 1,
          }}
        >
          {isWork ? step.ex.n : "Rest"}
        </h1>
        <div style={{ fontFamily: F.utility, fontSize: tv ? 20 : 13, color: "#8A9199", letterSpacing: 2 }}>
          {isWork
            ? isStrength
              ? step.label + (weights[step.ex.n] ? ` · ${weights[step.ex.n]} LB` : "")
              : step.label
            : step.next
            ? `NEXT UP: ${step.next.n.toUpperCase()}`
            : ""}
        </div>
      </div>

      {/* the plate timer */}
      <div style={{ display: "flex", justifyContent: "center", margin: tv ? "30px 0" : "18px 0" }}>
        <div style={{ position: "relative", width: R * 2 + 40, height: R * 2 + 40 }}>
          <svg width={R * 2 + 40} height={R * 2 + 40} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={R + 20} cy={R + 20} r={R} stroke="#2A2F37" strokeWidth={tv ? 22 : 16} fill="#1B1F25" />
            <circle
              cx={R + 20}
              cy={R + 20}
              r={R}
              stroke={isWork ? "#FFD338" : "#5FA8FF"}
              strokeWidth={tv ? 22 : 16}
              fill="none"
              strokeDasharray={C}
              strokeDashoffset={C * (1 - progress)}
              strokeLinecap="round"
              style={{ transition: "stroke-dashoffset 1s linear" }}
            />
          </svg>
          <div style={S.timerCenter}>
            <div style={{ fontFamily: F.display, fontSize: tv ? 96 : 64, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>
              {remaining}
            </div>
            <div style={{ fontFamily: F.utility, fontSize: tv ? 16 : 11, letterSpacing: 4, color: "#8A9199" }}>SECONDS</div>
          </div>
        </div>
      </div>

      {/* weight logger during rest (strength mode) */}
      {isStrength && step.ex.seed !== undefined && (
        <div style={{ display: "flex", justifyContent: "center", gap: 10, alignItems: "center", marginBottom: 12 }}>
          <span style={{ fontFamily: F.utility, fontSize: 12, letterSpacing: 2, color: "#8A9199" }}>DB WEIGHT</span>
          <input
            type="number"
            value={weights[step.ex.n] ?? ""}
            onChange={(e) => setWeights({ ...weights, [step.ex.n]: e.target.value })}
            style={{ ...S.input, width: 90, textAlign: "center", fontSize: 20, padding: "8px 4px" }}
          />
          <span style={{ fontFamily: F.utility, fontSize: 12, letterSpacing: 2, color: "#8A9199" }}>LB</span>
        </div>
      )}

      {/* controls */}
      <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
        <button
          className="go-btn"
          style={{ margin: 0, minWidth: 180, background: paused ? "#FFD338" : "#2A2F37", color: paused ? "#14171C" : "#F2F0EA" }}
          onClick={() => {
            if (!started) {
              setStarted(true);
              startTime.current = Date.now();
              beep(1200, 0.2);
            }
            setPaused(!paused);
          }}
        >
          {!started ? "START" : paused ? "RESUME" : "PAUSE"}
        </button>
        <button className="chip" style={{ fontSize: 14, padding: "0 18px" }} onClick={advance}>
          skip →
        </button>
      </div>

      {/* up next strip */}
      {!tv && (
        <div style={{ marginTop: 22 }}>
          <SectionLabel>THE PLAN</SectionLabel>
          <div style={{ display: "grid", gap: 6 }}>
            {workout.exercises.map((e, i) => (
              <div
                key={i}
                style={{
                  ...S.planRow,
                  opacity: i < step.ei ? 0.35 : 1,
                  borderLeft: i === step.ei ? "3px solid #FFD338" : "3px solid transparent",
                }}
              >
                <span>{e.n}</span>
                <span style={{ color: "#8A9199", fontFamily: F.utility, fontSize: 12 }}>
                  {isStrength ? `${workout.sets}×` : `${workout.workSec}s`}
                  {e.seed !== undefined && weights[e.n] ? ` · ${weights[e.n]}lb` : ""}
                </span>
              </div>
            ))}
          </div>
          <button className="chip" style={{ marginTop: 14 }} onClick={finish}>
            finish early & save
          </button>
        </div>
      )}
    </div>
  );
}

function DoneScreen({ onHome, onHistory }) {
  return (
    <div style={{ ...S.page, textAlign: "center", paddingTop: 80 }}>
      <div style={{ fontFamily: F.display, fontSize: 64 }}>DONE.</div>
      <p style={{ color: "#8A9199", fontFamily: F.utility, letterSpacing: 2, marginTop: 8 }}>
        WORKOUT SAVED TO YOUR HISTORY
      </p>
      <button className="go-btn" onClick={onHome}>BACK HOME</button>
      <button className="chip" style={{ marginTop: 12 }} onClick={onHistory}>view history</button>
    </div>
  );
}

function HistoryScreen({ history, profile, onBack }) {
  const mine = history.filter((h) => h.profile === profile);
  const totalMin = Math.round(mine.reduce((a, h) => a + (h.durationSec || 0), 0) / 60);
  // per-exercise best weight
  const best = {};
  mine.forEach((h) =>
    (h.entries || []).forEach((e) => {
      if (e.weight && (!best[e.name] || e.weight > best[e.name])) best[e.name] = e.weight;
    })
  );
  const bestList = Object.entries(best).sort((a, b) => b[1] - a[1]).slice(0, 6);

  return (
    <div style={S.page}>
      <Header sub={`${profile.toUpperCase()} — TRAINING LOG`} />
      <button className="chip" style={{ marginTop: 10 }} onClick={onBack}>← back</button>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 20 }}>
        <Stat label="WORKOUTS" value={mine.length} />
        <Stat label="TOTAL MINUTES" value={totalMin} />
      </div>

      {bestList.length > 0 && (
        <>
          <SectionLabel>TOP WEIGHTS</SectionLabel>
          <div style={{ display: "grid", gap: 6 }}>
            {bestList.map(([name, w]) => (
              <div key={name} style={S.planRow}>
                <span>{name}</span>
                <span style={{ fontFamily: F.display, color: "#FFD338" }}>{w} LB</span>
              </div>
            ))}
          </div>
        </>
      )}

      <SectionLabel>SESSIONS</SectionLabel>
      <div style={{ display: "grid", gap: 8 }}>
        {mine.length === 0 && <p style={S.hint}>No workouts yet — go crush one.</p>}
        {mine.map((h, i) => (
          <div key={i} style={{ ...S.selectCard, cursor: "default" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontFamily: F.display, letterSpacing: 1 }}>
                {h.mode === "strength" ? "STRENGTH" : "HIIT"} · {h.focus.toUpperCase()}
              </span>
              <span style={{ color: "#8A9199", fontFamily: F.utility, fontSize: 12 }}>
                {new Date(h.date).toLocaleDateString()}
              </span>
            </div>
            <div style={S.cardSub}>
              {Math.round((h.durationSec || 0) / 60)} min · {h.exerciseCount} exercises
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- small components ----------
